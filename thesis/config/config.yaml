# experiments/config.yaml

experiment:
  name: pareval_static_analysis_thesis
  description: "Evaluation of LLM-generated Serial, OpenMP, and MPI code with static analysis and correctness tests"
  schema_version: "experiment.v1"

profiles:
  smoke:
    run_id: smoke_001
    prompt_limit: 3
    num_samples_per_prompt: 1

  pilot:
    run_id: pilot_001
    prompt_limit: 30
    num_samples_per_prompt: 1

  # Dedicated base run for the repair-loop integration smoke: a planted
  # broken sample is injected as iteration 0 (no generation stage runs).
  repair_smoke:
    run_id: repair_smoke_001
    prompt_limit: 1
    num_samples_per_prompt: 1

  # Availability smoke for new models: ONE generation call per model.
  model_check:
    run_id: model_check_001
    prompt_limit: 1
    num_samples_per_prompt: 1

  full:
    run_id: full_001
    prompt_limit: null
    num_samples_per_prompt: 1

prompts:
  path: thesis/prompts/generation-prompts-thesis.json
  prompt_field: prompt
  execution_models:
    - serial
    - omp
    - mpi
  problem_types: null

generation_defaults:
  # Reasoning/thinking tokens count toward the output budget on GPT-5.5
  # (Responses API) and Claude Fable 5; 4096 caused truncation risk.
  max_output_tokens: 16384
  # Greedy decoding for reproducibility. Sent only to models that support it
  # (Gemini, Qwen, DeepSeek). GPT-5.5 and Claude Fable 5 do not accept
  # temperature/top_p; for those the records log null.
  temperature: 0.0
  # Irrelevant at temperature 0 and unsupported on several models; not sent.
  top_p: null
  timeout_seconds: 120
  retry_attempts: 2
  sleep_seconds_between_requests: 0.0
  # Single source of truth for the system prompt. The provider scripts have
  # no hardcoded fallback; this field is required.
  system_prompt: |
    You are an expert C++ and parallel programming assistant.
    Complete the given function according to the prompt.
    Return only the generated C++ code needed to complete the function.
    Do not include Markdown, explanations, or extra text.
    Preserve the required execution model: Serial, OpenMP, or MPI.

# Reasoning policy (see thesis/docs/model-set.md, "Reasoning policy"):
# middle/standard reasoning level where configurable, provider default
# where not; every deviation carries its technical justification here.
models:
  - id: openai_gpt55
    enabled: true
    provider: openai
    model_name: gpt-5.5
    api_key_env: OPENAI_API_KEY
    # policy: middle level of the effort scale (matches openai_gpt56_sol —
    # the generation pair must run the same level to be interpretable)
    reasoning_effort: medium

  - id: gemini_31_pro
    enabled: true
    provider: gemini
    model_name: gemini-3.1-pro-preview
    api_key_env: GEMINI_API_KEY
    # policy: middle level of the 3-series scale (low/medium/high)
    thinking_level: medium

  - id: claude_opus_48
    # Thinking must be ACTIVATED on Opus 4.8 (omitting the parameter runs
    # without thinking — the generation pair would otherwise compare
    # thinking vs. no-thinking against always-on Fable 5).
    # effort medium = policy middle level, SAME as claude_fable_5 (pair
    # symmetry).
    enabled: true
    provider: anthropic
    model_name: claude-opus-4-8
    api_key_env: ANTHROPIC_API_KEY
    thinking: adaptive
    effort: medium

  - id: claude_fable_5
    # Verified available via GET /v1/models on 2026-07-21 (batch: supported).
    # Generations pair with claude_opus_48 (same provider, adjacent tiers).
    # Thinking is ALWAYS ON on Fable 5 (no activation field needed, cannot
    # be disabled); depth steered via effort medium — SAME level as
    # claude_opus_48 (pair symmetry). temperature/top_p never sent;
    # refusals surface as stop_reason "refusal" -> ModelRefusal.
    enabled: true
    provider: anthropic
    model_name: claude-fable-5
    api_key_env: ANTHROPIC_API_KEY
    effort: medium

  - id: qwen_best
    enabled: false
    provider: openai_compatible
    model_name: replace_with_qwen_model_name
    base_url: replace_with_qwen_base_url
    api_key_env: QWEN_API_KEY

  - id: qwen3_coder_api
    # DOCUMENTED POLICY EXCEPTION: non-thinking model — no thinking
    # parameter exists to set (probe 2026-07-21: no reasoning_content,
    # enable_thinking silently ignored).
    enabled: true
    provider: openai_compatible
    model_name: qwen3-coder-plus
    base_url_env: ALIBABA_MODEL_STUDIO_BASE_URL
    api_key_env: ALIBABA_MODEL_STUDIO_API_KEY

  - id: deepseek_v4_pro
    # Thinking explicitly ON. reasoning_effort high = the LOWEST
    # practically effective level of the DeepSeek scale (medium would be a
    # de-facto throttle; effective levels are high/max). Probe 2026-07-21:
    # thinking arrives as a SEPARATE reasoning_content field,
    # message.content stays clean (the adapter reads only message.content).
    enabled: true
    provider: openai_compatible
    model_name: deepseek-v4-pro
    base_url_env: ALIBABA_MODEL_STUDIO_BASE_URL
    api_key_env: ALIBABA_MODEL_STUDIO_API_KEY
    extra_body:
      enable_thinking: true
      reasoning_effort: high

  # --- model-set extension (2026-07-21); API ids verified against the
  # --- provider models endpoints, see thesis/docs/model-set.md ---------

  - id: openai_gpt56_sol
    # Generations pair with openai_gpt55 — SAME reasoning_effort (medium,
    # policy middle level); the pair is only interpretable on one level.
    enabled: true
    provider: openai
    model_name: gpt-5.6-sol
    api_key_env: OPENAI_API_KEY
    reasoning_effort: medium

  - id: gemini_35_flash
    # Class pair with gemini_31_pro (pro vs flash tier).
    # thinking_level medium = middle of the 3.5 scale AND the 3.5-flash
    # provider default. NOTE: the 3.5 scale adds MINIMAL below low, so
    # "medium" is the middle of each series' own scale, not a perfectly
    # equivalent point across 3.1/3.5 (documented in model-set.md).
    enabled: true
    provider: gemini
    model_name: gemini-3.5-flash
    api_key_env: GEMINI_API_KEY
    thinking_level: medium

  - id: qwen37_max
    # Alibaba closed flagship (alongside qwen3_coder_api = code specialist).
    # Thinking explicitly ON; the Qwen API has no level scale — only a
    # token budget. thinking_budget 8192 is NON-CONSTRAINING (well below
    # observed spend ceilings and under the 16384 max_output_tokens; it
    # must not become the limiting factor). Probe 2026-07-21: separate
    # reasoning_content field, content clean.
    enabled: true
    provider: openai_compatible
    model_name: qwen3.7-max
    base_url_env: ALIBABA_MODEL_STUDIO_BASE_URL
    api_key_env: ALIBABA_MODEL_STUDIO_API_KEY
    extra_body:
      enable_thinking: true
      thinking_budget: 8192

  - id: qwen36_35b_a3b
    # Best open-weight generalist in the Qwen line (MoE 35B-A3B).
    # Same thinking setting as qwen37_max: explicitly ON, non-constraining
    # thinking_budget (no level scale exists). Probe 2026-07-21: separate
    # reasoning_content field, content clean.
    enabled: true
    provider: openai_compatible
    model_name: qwen3.6-35b-a3b
    base_url_env: ALIBABA_MODEL_STUDIO_BASE_URL
    api_key_env: ALIBABA_MODEL_STUDIO_API_KEY
    extra_body:
      enable_thinking: true
      thinking_budget: 8192

  - id: deepseek_v4_flash
    # Size pair with deepseek_v4_pro — SAME thinking setting (explicitly
    # ON, reasoning_effort high = lowest practically effective DeepSeek
    # level; separate reasoning_content, probe 2026-07-21).
    enabled: true
    provider: openai_compatible
    model_name: deepseek-v4-flash
    base_url_env: ALIBABA_MODEL_STUDIO_BASE_URL
    api_key_env: ALIBABA_MODEL_STUDIO_API_KEY
    extra_body:
      enable_thinking: true
      reasoning_effort: high

outputs:
  root: thesis/results
  raw_dir: thesis/results/raw
  intermediate_dir: thesis/results/intermediate
  processed_dir: thesis/results/processed

stages:
  generation:
    enabled: true
    output_file_name: generations.jsonl
    summary_file_name: generation_summary.json

  assembly:
    enabled: true
    output_file_name: assembly.jsonl
    # close exactly one missing '}' at EOF (model left the closing brace to
    # the scaffold); always flagged per sample as cleaning.auto_closed
    auto_close_single_brace: true
    # caps for repair feedback, see thesis/docs/repair-loop-design.md
    feedback_caps:
      compiler_lines: 50
      static_findings: 15
      test_failures: 10

  compilation:
    enabled: true
    output_file_name: compilation.jsonl

  static_analysis:
    enabled: true
    # Per-tool settings (schema validated at config load, see
    # thesis/evaluation/tool_config.py):
    #   enabled            — include/exclude is a CONFIG decision
    #   execution_models   — may only NARROW the tool's hard capabilities
    #                        (a tool never runs where it technically cannot)
    #   low_precision_warning / low_precision_families
    #                      — findings get low_confidence: true (tool-wide or
    #                        per check_id-prefix family); rendered as
    #                        verify-first hints in repair feedback
    # Container split stays via --tools (filters the enabled set):
    # compiler/clang_tidy/cppcheck/infer in pareval-thesis; parcoach in
    # parcoach-demo:2.4.1; llov in pareval-llov. Results merge per tool.
    tools:
      compiler:
        enabled: true
        execution_models: [serial, omp, mpi]
      clang_tidy:
        enabled: true
        execution_models: [serial, omp, mpi]
        # MPI-Checker family: validation measured precision 0.57 lax /
        # category-blind (strict recall 0.011) on MBI
        low_precision_families:
          - "clang-analyzer-optin.mpi"
      cppcheck:
        enabled: true
        execution_models: [serial, omp, mpi]
      infer:
        enabled: true
        execution_models: [serial, omp, mpi]
      parcoach:
        enabled: true
        execution_models: [mpi]
        # validation: precision 0.506 on MBI (FP rate 0.847 on correct
        # rank-conditional collectives)
        low_precision_warning: true
      llov:
        enabled: true
        execution_models: [omp]
    output_file_name: static_analysis.jsonl

  correctness_tests:
    enabled: true
    output_file_name: correctness.jsonl
    # iterations of the drivers' timing loops (validation unaffected);
    # per-run timeout catches hangs/deadlocks (omp/mpi)
    niter: 1
    run_timeout_seconds: 120

  dynamic_analysis:
    enabled: true
    # Sanitizer/DBI executions over the correctness launch grid (same
    # per-tool schema as static_analysis). Runs in pareval-thesis.
    tools:
      asan_ubsan:
        enabled: true
        execution_models: [serial, omp, mpi]
      tsan:
        enabled: true
        execution_models: [omp]
      memcheck:
        enabled: true
        execution_models: [serial, omp]
      must:
        enabled: true
        execution_models: [mpi]
      # Implemented but disabled by default — enabling is a config decision.
      # DRB validation: helgrind recall 0.93 at FP-RATE 0.89 (flags nearly
      # every race-free OpenMP kernel; stock futex-based runtimes), drd
      # recall 0.20. See thesis/docs/static-analysis-filtering.md.
      helgrind:
        enabled: false
        execution_models: [omp]
        low_precision_warning: true
      drd:
        enabled: false
        execution_models: [omp]
        low_precision_warning: true
    output_file_name: dynamic_analysis.jsonl

  enhanced_tests:
    enabled: false
    output_file_name: enhanced_tests.jsonl
    # Which model generates the edge-case input specs (EvalPlus-style).
    # A deliberate, open methodology decision — document the choice and its
    # independence question (spec model vs. evaluated models) in the thesis.
    spec_model: openai_gpt56_sol
    # System prompt for spec generation (single source of truth, mirrors
    # generation_defaults.system_prompt for code generation).
    spec_system_prompt: |
      You are an expert in software testing and C++ numerical code.
      You design minimal, high-value edge-case test inputs.
      You respond with STRICT JSON only: a single JSON array, no markdown
      fences, no prose. Every element must follow the schema given by the
      user exactly.
    # static base set: every parameterizable benchmark gets these sizes
    # with default random fill (list = count AND sizes)
    static_base_sizes: [0, 1, 2, 7]
    # valid-LLM-spec bounds per benchmark: below min triggers regeneration
    # (max 2 refill rounds, then under_target), max is the per-call ask
    llm_specs_min: 5
    llm_specs_max: 8
    # total specs per benchmark after static base + LLM seeds + mutation
    # fill-up (multiple deterministic rounds until reached or exhausted)
    target_cases_per_benchmark: 20
    # upper bound for spec sizes (validation rejects larger; keeps runtime
    # bounded — edge cases live at small sizes anyway)
    max_spec_size: 4096
    # patterns OFFERED to the spec model — a subset of the implemented
    # library in drivers/cpp/enhanced-fill.hpp (config selects, it can
    # never invent; unknown names fail at config load)
    offered_patterns: [random, all_zeros, all_same, ascending, descending,
                       alternating, extreme_values, duplicate_at,
                       sorted_except_one, spike_at, explicit_values]
    # explicit_values: only for sizes up to this bound (surgical cases)
    explicit_values_max_size: 64
    # baseline.hpp is capped to this many chars in the generation prompt
    baseline_prompt_max_chars: 12000
    # timeout per differential run (seconds)
    run_timeout_seconds: 30
    # where generate_test_specs.py writes and run_enhanced_tests.py reads
    specs_file: thesis/results/cache/enhanced/specs.jsonl

  repair:
    enabled: false
    max_iterations: 3
    # Loop orchestrator (thesis/repair/orchestrator.py + run_repair.py).
    # Which of the three ablation variants run (repair-loop-design.md §2).
    variants: [static_feedback, test_feedback, combined_feedback]
    # direct = synchronous provider calls (smoke/small runs); batch = one
    # batch job per (model, variant, iteration) on the provider batch APIs
    # (~50% cost, up-to-24h latency; the orchestrator never blocks — it
    # exits after submit and merges on the next run / --poll).
    api_mode: direct
    # Per-provider override, e.g. {openai_compatible: direct}. Providers
    # without a verified batch API fall back to direct with a log line
    # unless explicitly forced to batch here (then the OpenAI-style batch
    # client runs against their base_url).
    # MEASURED 2026-07-21: our Alibaba Model Studio EU deployment
    # (eu-central-1 maas endpoint) returns 404 on both /v1/files and
    # /v1/batches — no batch API there. Qwen/DeepSeek therefore run
    # DIRECT; do not force openai_compatible to batch on this endpoint.
    # See thesis/docs/model-set.md.
    api_mode_overrides: {}
    # parcoach/llov live in their own containers (parcoach-demo:2.4.1,
    # pareval-llov). manual: the orchestrator writes the runner commands to
    # repair/<variant>/pending_external.txt, pauses the wave
    # (analyzed_waiting_external) and continues once the records exist.
    # docker: it executes the templates below itself.
    external_tools_mode: manual
    external_tools: [parcoach, llov]
    # docker-mode command templates; placeholders: {repo} {config} {profile}
    # {run_id} {model_id} {tools}. Required only for external_tools_mode:
    # docker, e.g.:
    #   parcoach: 'docker run --rm -v "{repo}:/workspace" -w /workspace
    #     parcoach-demo:2.4.1 python3 thesis/evaluation/run_static_analysis.py
    #     --config {config} --profile {profile} --run-id {run_id}
    #     --model-id {model_id} --tools {tools}'
    external_tool_commands: {}
    # History rendering in repair requests (repair-loop-design.md §4):
    #   compressed  per past iteration: cleaned code + findings with
    #               truncated messages + one-sentence test verdict
    #   full        per past iteration: cleaned code + full-detail findings
    # Neither mode ever includes old mismatch numbers (fillRand has no
    # persisted seed — old expected/got values belong to other inputs).
    history_mode: compressed
    feedback:
      # Prefix rendered before low_confidence findings (see the tools'
      # low_precision_warning / low_precision_families settings).
      low_confidence_prefix: >
        Low-confidence hint (tool precision ~0.5 on validation suites) —
        verify at the given location before changing code:
      # Whether non-blocking findings (warnings, style, performance) are
      # rendered into feedback. Rendering-only: non-blocking findings never
      # count toward the stop criterion regardless of this flag.
      include_non_blocking: false
      # Message truncation for history findings (compressed mode only).
      history_message_max_chars: 80
      # Max differing indices in the mismatch report (when the patched
      # drivers provide the fields; rendering degrades to plain verdicts
      # without them).
      mismatch_report_max_indices: 3
      # Prompt building blocks (every template overridable).
      templates:
        task_header: "## Original task"
        history_iteration_header: "## Iteration {n} (previous attempt)"
        current_header: "## Current version (fix this)"
        feedback_header: "## Analysis feedback on the current version"
        non_blocking_header: >
          Non-blocking quality hints (optional improvements, not errors):
        instruction: >
          Output the complete corrected function. Line numbers in the
          feedback refer to the current version shown above.
        # Compile errors located in the driver TU are translated for the
        # model (a raw cpu.cc line reference would be meaningless):
        driver_error: >
          error at the call site in the test driver (your function
          name/signature likely does not match the expected interface):
          {message}
    # Feedback sources per loop variant (repair-loop-design.md §2).
    # compiler_errors is base feedback in EVERY variant (compiler rule:
    # building is a precondition; compiler warnings count as static
    # analysis and ride in via static_findings).
    strategies:
      static_feedback:
        sources: [compiler_errors, static_findings]
      test_feedback:
        sources: [compiler_errors, correctness_verdicts, dynamic_findings]
      combined_feedback:
        sources: [compiler_errors, static_findings,
                  correctness_verdicts, dynamic_findings]
    # How low_confidence findings (see tool low_precision_warning) affect
    # the loop's stop criterion — evaluated by the loop orchestrator:
    #   ignore          never affect stopping (pure feedback hints)
    #   grace_once      DEFAULT: count as blocking only while NEW; if the
    #                   same finding (check_id + line) persists unchanged
    #                   into the next iteration it stops counting — the
    #                   model had one iteration to verify; a persisting
    #                   report is treated as checked/false alarm. New
    #                   low_confidence findings get their own grace
    #                   iteration.
    #   always_blocking like normal blocking findings (permanent warners
    #                   such as parcoach then drive every loop to
    #                   max_iterations — experiment option, not a default)
    low_confidence_stop_mode: grace_once