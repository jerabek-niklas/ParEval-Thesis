# experiments/config.yaml

experiment:
  name: pareval_static_analysis_thesis
  description: "Evaluation of LLM-generated Serial, OpenMP, and MPI code with static analysis and correctness tests"
  schema_version: "experiment.v1"

profiles:
  smoke:
    run_id: smoke_003
    prompt_limit: 3
    num_samples_per_prompt: 1

  pilot:
    run_id: pilot_001
    prompt_limit: 30
    num_samples_per_prompt: 1

  # Dedicated base run for the repair-loop integration smoke: a planted
  # broken sample is injected as iteration 0 (no generation stage runs).
  repair_smoke:
    run_id: repair_smoke_001
    prompt_limit: 1
    num_samples_per_prompt: 1

  # Availability smoke for new models: ONE generation call per model.
  model_check:
    run_id: model_check_001
    prompt_limit: 1
    num_samples_per_prompt: 1

  full:
    run_id: full_001
    prompt_limit: null
    num_samples_per_prompt: 1

prompts:
  path: thesis/prompts/generation-prompts-thesis.json
  prompt_field: prompt
  execution_models:
    - serial
    - omp
    - mpi
  problem_types: null

generation_defaults:
  # Reasoning/thinking tokens count toward the output budget on GPT-5.5
  # (Responses API) and Claude Fable 5; 4096 caused truncation risk.
  max_output_tokens: 16384
  # Greedy decoding for reproducibility. Sent only to models that support it
  # (Gemini, Qwen, DeepSeek). GPT-5.5 and Claude Fable 5 do not accept
  # temperature/top_p; for those the records log null.
  temperature: 0.0
  # Irrelevant at temperature 0 and unsupported on several models; not sent.
  top_p: null
  # Per-request client timeout, handed to every provider SDK (Gemini gets it
  # converted to milliseconds). Without it the SDK defaults apply — OpenAI and
  # Anthropic default to 600 s, so one hung request would stall a run for ten
  # minutes and, with retries, for half an hour. A timeout raises a retryable
  # transport error, so it costs one retry, not the sample. The batch
  # control-plane calls use their own larger value (batch_api.py) because a
  # submit uploads a whole wave.
  # Note on the worst case: the OpenAI/Anthropic SDKs retry internally
  # (max_retries 2 by default, honoring Retry-After on 429 — deliberately
  # kept, rate limits matter over ~2000 calls), so one sample can cost up to
  # timeout_seconds x 3 (SDK) x (1 + retry_attempts) in the pathological case.
  # Measured with timeout_seconds 1 / retry_attempts 1: 12 s to a clean
  # APITimeoutError record instead of a hang.
  timeout_seconds: 300
  retry_attempts: 2
  sleep_seconds_between_requests: 0.0
  # Initial generation: direct = one synchronous call per sample;
  # batch = ONE provider batch job per model (~50% cheaper, up to 24 h
  # latency). The full run is 180 samples x 11 models = 1980 calls, which is
  # where batch pays off. The process never waits: it submits, writes
  # generation_batch.json next to generations.jsonl and exits; a later
  # `--poll` writes the records — through the SAME record path as direct
  # mode (common.apply_success/apply_failure), so the JSONLs are identical
  # in shape either way.
  # Kept at `direct` by default so smoke/model_check runs stay synchronous;
  # set to `batch` for the full run.
  api_mode: direct
  # Per-provider override, e.g. {gemini: direct}. Providers without a
  # verified batch API (openai_compatible = DashScope: Qwen, DeepSeek, GLM —
  # 404 on /v1/batches, measured 2026-07-21) fall back to direct with a log
  # line, exactly like the repair loop.
  api_mode_overrides: {}
  # Single source of truth for the system prompt. The provider scripts have
  # no hardcoded fallback; this field is required.
  system_prompt: |
    You are an expert C++ and parallel programming assistant.
    Complete the given function according to the prompt.
    Return only the generated C++ code needed to complete the function.
    Do not include Markdown fences, explanations, or extra text.
    Preserve the required execution model: Serial, OpenMP, or MPI.

# Reasoning policy (see thesis/docs/model-set.md, "Reasoning policy"):
# middle/standard reasoning level where configurable, provider default
# where not; every deviation carries its technical justification here.
models:
  - id: openai_gpt55
    enabled: true
    provider: openai
    model_name: gpt-5.5
    api_key_env: OPENAI_API_KEY
    # list price USD per 1M tokens (thesis/docs/model-set.md,
    # retrieved 2026-07-21/28); used only for the --dry-run cost estimate
    price_per_mtok_in: 5.0
    price_per_mtok_out: 30.0
    # policy: middle level of the effort scale (matches openai_gpt56_sol —
    # the generation pair must run the same level to be interpretable)
    reasoning_effort: medium

  - id: gemini_31_pro
    enabled: true
    provider: gemini
    model_name: gemini-3.1-pro-preview
    api_key_env: GEMINI_API_KEY
    # list price USD per 1M tokens (thesis/docs/model-set.md,
    # retrieved 2026-07-21/28); used only for the --dry-run cost estimate
    price_per_mtok_in: 2.0
    price_per_mtok_out: 12.0
    # policy: middle level of the 3-series scale (low/medium/high)
    thinking_level: medium

  - id: claude_opus_5
    # Verified 2026-07-31 via GET /v1/models (id `claude-opus-5`).
    # NO `thinking` field: unlike Opus 4.8, Opus 5 thinks WITHOUT explicit
    # activation — probe 2026-07-31 on an MPI LU prompt with an empty
    # payload returned 806 thinking tokens (4.8 returns 0 in that case).
    # It therefore behaves like claude_fable_5, and the pair is now
    # symmetric in BOTH fields, not just in effort.
    # effort medium = policy middle level, SAME as claude_fable_5.
    enabled: true
    provider: anthropic
    model_name: claude-opus-5
    api_key_env: ANTHROPIC_API_KEY
    # list price USD per 1M tokens (platform.claude.com pricing, retrieved
    # 2026-07-31: unchanged vs. Opus 4.8; batch 2.50/12.50)
    price_per_mtok_in: 5.0
    price_per_mtok_out: 25.0
    effort: medium

  - id: claude_opus_48
    # DISABLED 2026-07-31 — superseded by claude_opus_5. The entry stays
    # (and its id is NOT recycled) so the existing smoke_001 /
    # model_check_001 / repair_smoke_001 records remain attributable to the
    # model that actually produced them. Same convention as gemini_35_flash.
    # Thinking had to be ACTIVATED on 4.8: omitting the parameter ran
    # without thinking, which is why this entry carries `thinking: adaptive`
    # and the Opus 5 entry does not.
    enabled: false
    provider: anthropic
    model_name: claude-opus-4-8
    api_key_env: ANTHROPIC_API_KEY
    price_per_mtok_in: 5.0
    price_per_mtok_out: 25.0
    thinking: adaptive
    effort: medium

  - id: claude_fable_5
    # Verified available via GET /v1/models on 2026-07-21 (batch: supported).
    # Generations pair with claude_opus_5 (same provider, adjacent tiers).
    # Thinking is ALWAYS ON on Fable 5 (no activation field needed, cannot
    # be disabled); depth steered via effort medium — SAME level as
    # claude_opus_5 (pair symmetry). temperature/top_p never sent;
    # refusals surface as stop_reason "refusal" -> ModelRefusal.
    enabled: true
    provider: anthropic
    model_name: claude-fable-5
    api_key_env: ANTHROPIC_API_KEY
    # list price USD per 1M tokens (thesis/docs/model-set.md,
    # retrieved 2026-07-21/28); used only for the --dry-run cost estimate
    price_per_mtok_in: 10.0
    price_per_mtok_out: 50.0
    effort: medium

  - id: qwen_best
    enabled: false
    provider: openai_compatible
    model_name: replace_with_qwen_model_name
    base_url: replace_with_qwen_base_url
    api_key_env: QWEN_API_KEY

  - id: qwen3_coder_api
    # DOCUMENTED POLICY EXCEPTION: non-thinking model — no thinking
    # parameter exists to set (probe 2026-07-21: no reasoning_content,
    # enable_thinking silently ignored).
    enabled: true
    provider: openai_compatible
    model_name: qwen3-coder-plus
    base_url_env: ALIBABA_MODEL_STUDIO_BASE_URL
    api_key_env: ALIBABA_MODEL_STUDIO_API_KEY
    # list price USD per 1M tokens (thesis/docs/model-set.md,
    # retrieved 2026-07-21/28); used only for the --dry-run cost estimate
    price_per_mtok_in: 0.65
    price_per_mtok_out: 3.25

  - id: deepseek_v4_pro
    # Thinking explicitly ON. reasoning_effort high = the LOWEST
    # practically effective level of the DeepSeek scale (medium would be a
    # de-facto throttle; effective levels are high/max). Probe 2026-07-21:
    # thinking arrives as a SEPARATE reasoning_content field,
    # message.content stays clean (the adapter reads only message.content).
    enabled: true
    provider: openai_compatible
    model_name: deepseek-v4-pro
    base_url_env: ALIBABA_MODEL_STUDIO_BASE_URL
    api_key_env: ALIBABA_MODEL_STUDIO_API_KEY
    # list price USD per 1M tokens (thesis/docs/model-set.md,
    # retrieved 2026-07-21/28); used only for the --dry-run cost estimate
    price_per_mtok_in: 0.435
    price_per_mtok_out: 0.87
    extra_body:
      enable_thinking: true
      reasoning_effort: high
      # REQUIRED at effort high: without a budget the reasoning can consume
      # the ENTIRE max_tokens (measured on smoke_002 combined_feedback
      # iter1, sample ...__serial__sample_0: 16384/16385 completion tokens
      # were reasoning, content EMPTY, finish_reason length, 58K chars of
      # reasoning_content for a 1.8K request — deterministic over 3
      # retries). With the budget the same request answers cleanly:
      # reasoning_tokens capped at exactly 8192, finish_reason stop
      # (verified 2026-08-05). Same value as the Qwen models —
      # non-constraining for normal spend (probes: 112-1721 tokens), well
      # below the 16384 output cap.
      thinking_budget: 8192

  # --- model-set extension (2026-07-21); API ids verified against the
  # --- provider models endpoints, see thesis/docs/model-set.md ---------

  - id: openai_gpt56_sol
    # Generations pair with openai_gpt55 — SAME reasoning_effort (medium,
    # policy middle level); the pair is only interpretable on one level.
    enabled: true
    provider: openai
    model_name: gpt-5.6-sol
    api_key_env: OPENAI_API_KEY
    # list price USD per 1M tokens (thesis/docs/model-set.md,
    # retrieved 2026-07-21/28); used only for the --dry-run cost estimate
    price_per_mtok_in: 5.0
    price_per_mtok_out: 30.0
    reasoning_effort: medium

  - id: gemini_35_flash
    # SUPERSEDED 2026-07-28 by gemini_36_flash (3.6 Flash is GA, more
    # token-efficient and cheaper at better code/agent capability). The
    # entry is kept (NOT recycled, NOT renamed) so records from earlier
    # runs stay attributable to the model that produced them.
    enabled: false
    provider: gemini
    model_name: gemini-3.5-flash
    api_key_env: GEMINI_API_KEY
    # list price USD per 1M tokens (thesis/docs/model-set.md,
    # retrieved 2026-07-21/28); used only for the --dry-run cost estimate
    price_per_mtok_in: 1.5
    price_per_mtok_out: 9.0
    thinking_level: medium

  - id: gemini_36_flash
    # Class pair with gemini_31_pro (pro vs flash tier); replaces
    # gemini_35_flash. API id verified against the models endpoint
    # 2026-07-28. thinking_level medium = middle of the same
    # MINIMAL/LOW/MEDIUM/HIGH scale as 3.5 (probe 2026-07-28: accepted);
    # the scale still differs from the 3.1 series (which has no MINIMAL),
    # see model-set.md.
    enabled: true
    provider: gemini
    model_name: gemini-3.6-flash
    api_key_env: GEMINI_API_KEY
    # list price USD per 1M tokens (thesis/docs/model-set.md,
    # retrieved 2026-07-21/28); used only for the --dry-run cost estimate
    price_per_mtok_in: 1.5
    price_per_mtok_out: 7.5
    thinking_level: medium

  - id: qwen37_max
    # Alibaba closed flagship (alongside qwen3_coder_api = code specialist).
    # Thinking explicitly ON; the Qwen API has no level scale — only a
    # token budget. thinking_budget 8192 is NON-CONSTRAINING (well below
    # observed spend ceilings and under the 16384 max_output_tokens; it
    # must not become the limiting factor). Probe 2026-07-21: separate
    # reasoning_content field, content clean.
    enabled: true
    provider: openai_compatible
    model_name: qwen3.7-max
    base_url_env: ALIBABA_MODEL_STUDIO_BASE_URL
    api_key_env: ALIBABA_MODEL_STUDIO_API_KEY
    # list price USD per 1M tokens (thesis/docs/model-set.md,
    # retrieved 2026-07-21/28); used only for the --dry-run cost estimate
    price_per_mtok_in: 1.25
    price_per_mtok_out: 3.75
    extra_body:
      enable_thinking: true
      thinking_budget: 8192

  - id: qwen36_35b_a3b
    # Best open-weight generalist in the Qwen line (MoE 35B-A3B).
    # Same thinking setting as qwen37_max: explicitly ON, non-constraining
    # thinking_budget (no level scale exists). Probe 2026-07-21: separate
    # reasoning_content field, content clean.
    enabled: true
    provider: openai_compatible
    model_name: qwen3.6-35b-a3b
    base_url_env: ALIBABA_MODEL_STUDIO_BASE_URL
    api_key_env: ALIBABA_MODEL_STUDIO_API_KEY
    # list price USD per 1M tokens (thesis/docs/model-set.md,
    # retrieved 2026-07-21/28); used only for the --dry-run cost estimate
    price_per_mtok_in: 0.14
    price_per_mtok_out: 0.9
    extra_body:
      enable_thinking: true
      thinking_budget: 8192

  - id: deepseek_v4_flash
    # Size pair with deepseek_v4_pro — SAME thinking setting (explicitly
    # ON, reasoning_effort high = lowest practically effective DeepSeek
    # level; separate reasoning_content, probe 2026-07-21).
    enabled: true
    provider: openai_compatible
    model_name: deepseek-v4-flash
    base_url_env: ALIBABA_MODEL_STUDIO_BASE_URL
    api_key_env: ALIBABA_MODEL_STUDIO_API_KEY
    # list price USD per 1M tokens (thesis/docs/model-set.md,
    # retrieved 2026-07-21/28); used only for the --dry-run cost estimate
    price_per_mtok_in: 0.14
    price_per_mtok_out: 0.28
    extra_body:
      enable_thinking: true
      reasoning_effort: high
      # Same guard and value as deepseek_v4_pro (size pair runs one
      # setting): unbounded reasoning at effort high can displace the whole
      # output budget (measured on the pro model, see there). Acceptance
      # verified for flash 2026-08-05.
      thinking_budget: 8192

  # --- test-case generator, NOT part of the evaluation set ---------------
  # Deliberately enabled: false — this model must NEVER take part in a
  # generation run; the adapter only needs to know it so that
  # stages.enhanced_tests.spec_model can resolve it. See model-set.md
  # ("Test-case generator").
  - id: glm_5_2
    # GLM (Zhipu) family — outside the evaluated model set, reachable via
    # the existing Model Studio key (it hosts third-party models next to
    # Qwen), so no new provider/account. glm-5.2 is the strongest GLM on
    # OUR endpoint (verified 2026-07-28: glm-5.1 and glm-5.2 listed;
    # glm-5 / glm-4.7 are not).
    # Thinking: provider default (ON). Probe 2026-07-28: reasoning lands in
    # a SEPARATE reasoning_content field, message.content carries clean
    # strict JSON (no <think> blocks, no markdown fences) — exactly what
    # generate_test_specs.py requires, so no enable_thinking override.
    enabled: false
    provider: openai_compatible
    model_name: glm-5.2
    base_url_env: ALIBABA_MODEL_STUDIO_BASE_URL
    api_key_env: ALIBABA_MODEL_STUDIO_API_KEY

outputs:
  root: thesis/results
  raw_dir: thesis/results/raw
  intermediate_dir: thesis/results/intermediate
  processed_dir: thesis/results/processed

stages:
  generation:
    enabled: true
    output_file_name: generations.jsonl
    summary_file_name: generation_summary.json

  assembly:
    enabled: true
    output_file_name: assembly.jsonl
    # close exactly one missing '}' at EOF (model left the closing brace to
    # the scaffold); always flagged per sample as cleaning.auto_closed
    auto_close_single_brace: true
    # caps for repair feedback, see thesis/docs/repair-loop-design.md
    feedback_caps:
      compiler_lines: 50
      static_findings: 15
      test_failures: 10

  compilation:
    enabled: true
    output_file_name: compilation.jsonl

  static_analysis:
    enabled: true
    # Per-tool settings (schema validated at config load, see
    # thesis/evaluation/tool_config.py):
    #   enabled            — include/exclude is a CONFIG decision
    #   execution_models   — may only NARROW the tool's hard capabilities
    #                        (a tool never runs where it technically cannot)
    #   low_precision_warning / low_precision_families
    #                      — findings get low_confidence: true (tool-wide or
    #                        per check_id-prefix family); rendered as
    #                        verify-first hints in repair feedback
    # Container split stays via --tools (filters the enabled set):
    # compiler/gcc_analyzer/clang_tidy/cppcheck/infer in pareval-thesis;
    # parcoach in parcoach-demo:2.4.1; llov in pareval-llov. Results merge
    # per tool.
    tools:
      compiler:
        enabled: true
        execution_models: [serial, omp, mpi]
      # GCC's own path-sensitive symbolic execution (-fanalyzer), a separate
      # compile-only pass — the compiler tool is also the build gate, and
      # -Wall diagnostics vs. symbolic execution are two detection methods
      # (same split as clang_sa vs. clang_tidy_ast).
      # Validation (Juliet, results/variant_deltas.csv): recall 0.234 ->
      # 0.477, precision 0.933 -> 0.937, FP rate 0.032, 158 kernels that the
      # plain compiler pass misses and 0 the other way round, runtime 1.03x.
      # On the C++ part of the suite it is the strongest static tool
      # (recall 0.717 at precision 1.0), which is what this pipeline analyzes.
      # -Wanalyzer-* findings are blocking: they are warnings syntactically
      # but describe real defects, and only blocking findings reach the
      # repair feedback.
      # Suite check on ParEval-shaped code (60 benchmarks x 3 models, each
      # benchmark's own reference implementation as the model file, so every
      # blocking finding is a false alarm): gcc_analyzer flags 3.1% of runs,
      # clang_tidy — already gating — flags 20.4%. If the full run shows this
      # is still too loud, add low_precision_families here (no code change):
      #   low_precision_families: ["-Wanalyzer-use-of-uninitialized-value"]
      gcc_analyzer:
        enabled: true
        execution_models: [serial, omp, mpi]
        # more generous than the compiler tool's 120 s — symbolic execution
        # is the expensive pass (measured ~2 s per TU, 6 s worst case)
        timeout_seconds: 300
      clang_tidy:
        enabled: true
        execution_models: [serial, omp, mpi]
        # MPI-Checker family: validation measured precision 0.57 lax /
        # category-blind (strict recall 0.011) on MBI
        low_precision_families:
          - "clang-analyzer-optin.mpi"
      cppcheck:
        enabled: true
        execution_models: [serial, omp, mpi]
      infer:
        enabled: true
        execution_models: [serial, omp, mpi]
        # InferBO (--bufferoverrun) runs inside the same infer invocation.
        # Findings are kept only up to this confidence level; the measured
        # level table (results/inferbo_levels.csv) is unambiguous:
        #   L1  36 true positives /  0 false positives  (precision 1.0)
        #   L3   0 true positives / 58 false positives  (precision 0.0)
        # L3-L5 are therefore DISCARDED, not kept as non-blocking — even
        # non-blocking findings reach the repair feedback. With the filter:
        # recall 0.095 -> 0.151 AND precision 0.805 -> 0.867 at an unchanged
        # FP rate, for 1.09x runtime.
        # Honest caveat: on the C++ kernels of the validation suite the
        # contribution is exactly zero (infer, infer_bo and infer_bo_l1l2 are
        # identical there); all extra findings were on C testcases. Included
        # because it costs almost nothing and does not hurt precision — a
        # contribution on LLM-generated C++ is plausible but not proven.
        bufferoverrun_max_level: 2
      parcoach:
        enabled: true
        execution_models: [mpi]
        # validation: precision 0.506 on MBI (FP rate 0.847 on correct
        # rank-conditional collectives)
        low_precision_warning: true
      llov:
        enabled: true
        execution_models: [omp]
    output_file_name: static_analysis.jsonl

  correctness_tests:
    enabled: true
    output_file_name: correctness.jsonl
    # iterations of the drivers' timing loops (validation unaffected);
    # per-run timeout catches hangs/deadlocks (omp/mpi)
    niter: 1
    run_timeout_seconds: 120

  dynamic_analysis:
    enabled: true
    # Sanitizer/DBI executions over the correctness launch grid (same
    # per-tool schema as static_analysis). Runs in pareval-thesis.
    tools:
      asan_ubsan:
        enabled: true
        execution_models: [serial, omp, mpi]
      tsan:
        enabled: true
        execution_models: [omp]
      memcheck:
        enabled: true
        execution_models: [serial, omp]
      must:
        enabled: true
        execution_models: [mpi]
      # Implemented but disabled by default — enabling is a config decision.
      # DRB validation: helgrind recall 0.93 at FP-RATE 0.89 (flags nearly
      # every race-free OpenMP kernel; stock futex-based runtimes), drd
      # recall 0.20. See thesis/docs/static-analysis-filtering.md.
      helgrind:
        enabled: false
        execution_models: [omp]
        low_precision_warning: true
      drd:
        enabled: false
        execution_models: [omp]
        low_precision_warning: true
    output_file_name: dynamic_analysis.jsonl

  enhanced_tests:
    enabled: true
    output_file_name: enhanced_tests.jsonl
    # Which model generates the edge-case input specs (EvalPlus-style).
    # Deliberate methodology decision (2026-07-28): the generator comes from
    # a model family that is NOT in the evaluation set — GLM (Zhipu), see
    # the glm_5_2 entry — so no evaluated model writes its own test cases.
    # The oracle stays the serial baseline in every case, independent of
    # the generator. Previous generators: openai_gpt55, then
    # openai_gpt56_sol (both IN the evaluation set); their specs are
    # archived under results/cache/enhanced/archive/ for a generator
    # comparison.
    spec_model: glm_5_2
    # System prompt for spec generation (single source of truth, mirrors
    # generation_defaults.system_prompt for code generation).
    spec_system_prompt: |
      You are an expert in software testing and C++ numerical code.
      You design minimal, high-value edge-case test inputs.
      You respond with STRICT JSON only: a single JSON array, no markdown
      fences, no prose. Every element must follow the schema given by the
      user exactly.
    # static base set: every parameterizable benchmark gets these sizes
    # with default random fill (list = count AND sizes)
    static_base_sizes: [0, 1, 2, 7]
    # valid-LLM-spec bounds per benchmark: below min triggers regeneration
    # (max 2 refill rounds, then under_target), max is the per-call ask
    llm_specs_min: 5
    llm_specs_max: 8
    # total specs per benchmark after static base + LLM seeds + mutation
    # fill-up (multiple deterministic rounds until reached or exhausted)
    target_cases_per_benchmark: 20
    # upper bound for spec sizes (validation rejects larger; keeps runtime
    # bounded — edge cases live at small sizes anyway)
    max_spec_size: 4096
    # patterns OFFERED to the spec model — a subset of the implemented
    # library in drivers/cpp/enhanced-fill.hpp (config selects, it can
    # never invent; unknown names fail at config load)
    offered_patterns: [random, all_zeros, all_same, ascending, descending,
                       alternating, extreme_values, duplicate_at,
                       sorted_except_one, spike_at, explicit_values]
    # explicit_values: cap on the NUMBER OF VALUES a spec may carry
    # (surgical cases). Since 2026-07-28 this binds on the element count
    # derived from the benchmark's input shape, not on `size`: for 1-D
    # benchmarks the two are identical (unchanged meaning), for n x n matrix
    # benchmarks it now correctly limits n*n. 64 keeps hand-written cases
    # readable and allows matrices up to 8x8 — beyond that a spec is no
    # longer a surgical case but a data dump.
    explicit_values_max_size: 64
    # baseline.hpp is capped to this many chars in the generation prompt
    baseline_prompt_max_chars: 12000
    # Which execution models the enhanced stage covers. [serial] = the
    # historical behavior; the PILOT sets [serial, omp, mpi]. The GATES
    # (baseline selftest + fast-math stability probe) stay SERIAL in every
    # case — pilot decision, residual risks documented in
    # docs/enhanced-tests-parallel.md: (a) driver divergence can surface as
    # crash/timeout on omp/mpi model runs and needs manual sighting,
    # (b) parallel rounding of a serial oracle shows up as small relative
    # deviations at many indices (rounding signature, not a model error).
    execution_models: [serial, omp, mpi]
    # ONE fixed launch point for parallel samples — deliberately NOT a
    # grid (launch grids are the correctness stage's axis). omp: thread
    # count via OMP_NUM_THREADS + argv, mpi: mpirun -np ranks — both via
    # the correctness stage's LaunchConfig.
    enhanced_launch:
      omp_threads: 4
      mpi_ranks: 4
    # timeout per differential run (seconds). Covers the mpirun startup
    # overhead too (~1-2 s per run); generous headroom at the tiny
    # DRIVER_PROBLEM_SIZE (1<<4) the stage builds with.
    run_timeout_seconds: 30
    # Worker-pool width over SAMPLES per EXECUTION model (serial/omp/mpi —
    # execution models, not LLM models; built-in default 1/1/1 = the old
    # serial behavior; CLI --jobs overrides with highest priority).
    # serial=2 is safe on any >=4-core machine (each serial sample uses one
    # core); omp/mpi stay at 1 because each sample already occupies
    # omp_threads/mpi_ranks (4) cores — budget rule and examples in
    # docs/parallel-execution.md. Raise only within
    # terminals x jobs x (1|threads|ranks) <= physical cores.
    jobs:
      serial: 2
      omp: 1
      mpi: 1
    # where generate_test_specs.py writes and run_enhanced_tests.py reads
    specs_file: thesis/results/cache/enhanced/specs.jsonl

  repair:
    enabled: true
    max_iterations: 2
    # Loop orchestrator (thesis/repair/orchestrator.py + run_repair.py).
    # Which of the three ablation variants run (repair-loop-design.md §2).
    variants: [static_feedback, test_feedback, combined_feedback]
    # direct = synchronous provider calls (smoke/small runs); batch = one
    # batch job per (model, variant, iteration) on the provider batch APIs
    # (~50% cost, up-to-24h latency; the orchestrator never blocks — it
    # exits after submit and merges on the next run / --poll).
    api_mode: direct
    # Per-provider override, e.g. {openai_compatible: direct}. Providers
    # without a verified batch API fall back to direct with a log line
    # unless explicitly forced to batch here (then the OpenAI-style batch
    # client runs against their base_url).
    # MEASURED 2026-07-21: our Alibaba Model Studio EU deployment
    # (eu-central-1 maas endpoint) returns 404 on both /v1/files and
    # /v1/batches — no batch API there. Qwen/DeepSeek therefore run
    # DIRECT; do not force openai_compatible to batch on this endpoint.
    # See thesis/docs/model-set.md.
    api_mode_overrides: {}
    # parcoach/llov live in their own containers (parcoach-demo:2.4.1,
    # pareval-llov). manual: the orchestrator writes the runner commands to
    # repair/<variant>/pending_external.txt, pauses the wave
    # (analyzed_waiting_external) and continues once the records exist.
    # docker: it executes the templates below itself.
    # DEFAULT since 2026-07-31: docker. Manual container handling per wave
    # is not workable for 11 models x 3 variants x N iterations; with the
    # templates below the loop runs unattended. Switch back to `manual` if
    # the docker socket is not available to the orchestrator.
    external_tools_mode: docker
    external_tools: [parcoach, llov]
    # Repo path as the HOST daemon sees it. The orchestrator runs INSIDE the
    # toolchain container (repo at /workspace) and starts the tool containers
    # as SIBLINGS through the mounted socket, so their -v mounts need the
    # host path — {repo} would mount an empty dir. Can also be supplied via
    # the PAREVAL_HOST_REPO environment variable (preferred: keeps the
    # machine-specific path out of the committed config); with neither set,
    # the orchestrator's own repo path is used, which is correct when it
    # runs on the host.
    host_repo_path: null
    # docker-mode command templates; placeholders: {repo} {host_repo}
    # {config} {profile} {run_id} {model_id} {tools}.
    # Prerequisites: the toolchain image ships the docker CLI (docker/
    # Dockerfile) and the orchestrator container must be started with
    #   -v /var/run/docker.sock:/var/run/docker.sock
    # PARCOACH needs -u 0 (its image runs as a non-root user that cannot
    # write into the mounted results tree); LLOV's image has python3.8 only.
    external_tool_commands:
      parcoach: >-
        docker run --rm -u 0 -v "{host_repo}:/workspace" -w /workspace
        registry.gitlab.inria.fr/parcoach/parcoach-demo:2.4.1
        python3 thesis/evaluation/run_static_analysis.py
        --config {config} --profile {profile} --run-id {run_id}
        --model-id {model_id} --tools {tools}
      llov: >-
        docker run --rm -u 0 -v "{host_repo}:/workspace" -w /workspace
        pareval-llov
        python3.8 thesis/evaluation/run_static_analysis.py
        --config {config} --profile {profile} --run-id {run_id}
        --model-id {model_id} --tools {tools}
    # History rendering in repair requests (repair-loop-design.md §4):
    #   compressed  per past iteration: cleaned code + findings with
    #               truncated messages + one-sentence test verdict
    #   full        per past iteration: cleaned code + full-detail findings
    # Neither mode ever includes old mismatch numbers — a COMPRESSION
    # rule, not input identity: fillRand draws from unseeded rand() (as if
    # srand(1)), inputs are identical across iterations; old expected/got
    # describe the PREVIOUS code's output (design §4, "Corrected
    # rationale", 2026-08-06).
    # DECISION 2026-07-31: 'full' for the main run (the design originally
    # defaulted to 'compressed'). The repair loop itself is the object of
    # study, so the model must see the full finding detail of every past
    # iteration — otherwise "the model kept reintroducing finding X" cannot
    # be told apart from "the model was never told precisely enough".
    # The price is measurable BEFORE spending it: run_repair.py --dry-run
    # renders every wave in both modes and prints chars/tokens/cost for each.
    history_mode: full
    feedback:
      # Prefix rendered before low_confidence findings (see the tools'
      # low_precision_warning / low_precision_families settings).
      low_confidence_prefix: >
        Low-confidence hint (tool precision ~0.5 on validation suites) —
        verify at the given location before changing code:
      # Whether non-blocking findings (warnings, style, performance) are
      # rendered into feedback. Rendering-only: non-blocking findings never
      # count toward the stop criterion regardless of this flag.
      include_non_blocking: false
      # Message truncation for history findings (compressed mode only).
      history_message_max_chars: 80
      # Max differing indices in the mismatch report (when the patched
      # drivers provide the fields; rendering degrades to plain verdicts
      # without them).
      mismatch_report_max_indices: 3
      # Prompt building blocks (every template overridable).
      templates:
        task_header: "## Original task"
        history_iteration_header: "## Iteration {n} (previous attempt)"
        current_header: "## Current version (fix this)"
        feedback_header: "## Analysis feedback on the current version"
        non_blocking_header: >
          Non-blocking quality hints (optional improvements, not errors):
        instruction: >
          Output the complete corrected function. Line numbers in the
          feedback refer to the current version shown above.
        # Compile errors located in the driver TU are translated for the
        # model (a raw cpu.cc line reference would be meaningless):
        driver_error: >
          error at the call site in the test driver (your function
          name/signature likely does not match the expected interface):
          {message}
    # Feedback sources per loop variant (repair-loop-design.md §2).
    # compiler_errors is base feedback in EVERY variant (compiler rule:
    # building is a precondition; compiler warnings count as static
    # analysis and ride in via static_findings).
    strategies:
      static_feedback:
        sources: [compiler_errors, static_findings]
      test_feedback:
        sources: [compiler_errors, correctness_verdicts, dynamic_findings]
      combined_feedback:
        sources: [compiler_errors, static_findings,
                  correctness_verdicts, dynamic_findings]
    # How low_confidence findings (see tool low_precision_warning) affect
    # the loop's stop criterion — evaluated by the loop orchestrator:
    #   ignore          never affect stopping (pure feedback hints)
    #   grace_once      DEFAULT: count as blocking only while NEW; if the
    #                   same finding (check_id + line) persists unchanged
    #                   into the next iteration it stops counting — the
    #                   model had one iteration to verify; a persisting
    #                   report is treated as checked/false alarm. New
    #                   low_confidence findings get their own grace
    #                   iteration.
    #   always_blocking like normal blocking findings (permanent warners
    #                   such as parcoach then drive every loop to
    #                   max_iterations — experiment option, not a default)
    low_confidence_stop_mode: grace_once