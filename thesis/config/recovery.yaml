  "outputs": {
    "root": "thesis/results",
    "raw_dir": "thesis/results/raw",
    "intermediate_dir": "thesis/results/intermediate",
    "processed_dir": "thesis/results/processed",
    "readiness_artifact": "thesis/evaluation/recovery/full_ext_recovery_001/readiness.json"
  },
  "stages": {
    "generation": {
      "enabled": true,
      "output_file_name": "generations.jsonl",
      "summary_file_name": "generation_summary.json"
    },
    "assembly": {
      "enabled": true,
      "output_file_name": "assembly.jsonl",
      "auto_close_single_brace": true,
      "feedback_caps": {
        "compiler_lines": 50,
        "static_findings": 15,
        "test_failures": 10
      }
    },
    "compilation": {
      "enabled": true,
      "output_file_name": "compilation.jsonl"
    },
    "static_analysis": {
      "enabled": true,
      "tools": {
        "compiler": {
          "enabled": true,
          "execution_models": [
            "serial",
            "omp",
            "mpi"
          ]
        },
        "gcc_analyzer": {
          "enabled": true,
          "execution_models": [
            "serial",
            "omp",
            "mpi"
          ],
          "timeout_seconds": 300
        },
        "clang_tidy": {
          "enabled": true,
          "execution_models": [
            "serial",
            "omp",
            "mpi"
          ],
          "low_precision_families": [
            "clang-analyzer-optin.mpi"
          ]
        },
        "cppcheck": {
          "enabled": true,
          "execution_models": [
            "serial",
            "omp",
            "mpi"
          ]
        },
        "infer": {
          "enabled": true,
          "execution_models": [
            "serial",
            "mpi"
          ],
          "bufferoverrun_max_level": 2
        },
        "parcoach": {
          "enabled": true,
          "execution_models": [
            "mpi"
          ],
          "low_precision_warning": true,
          "timeout_seconds": 60
        },
        "llov": {
          "enabled": true,
          "execution_models": [
            "omp"
          ]
        }
      },
      "output_file_name": "static_analysis.jsonl"
    },
    "correctness_tests": {
      "enabled": true,
      "output_file_name": "correctness.jsonl",
      "niter": 1,
      "run_timeout_seconds": 120
    },
    "dynamic_analysis": {
      "enabled": true,
      "tools": {
        "asan_ubsan": {
          "enabled": true,
          "execution_models": [
            "serial",
            "omp",
            "mpi"
          ]
        },
        "tsan": {
          "enabled": true,
          "execution_models": [
            "omp"
          ]
        },
        "memcheck": {
          "enabled": true,
          "execution_models": [
            "serial",
            "omp"
          ]
        },
        "must": {
          "enabled": true,
          "execution_models": [
            "mpi"
          ]
        },
        "helgrind": {
          "enabled": false,
          "execution_models": [
            "omp"
          ],
          "low_precision_warning": true
        },
        "drd": {
          "enabled": false,
          "execution_models": [
            "omp"
          ],
          "low_precision_warning": true
        }
      },
      "output_file_name": "dynamic_analysis.jsonl"
    },
    "enhanced_tests": {
      "enabled": true,
      "output_file_name": "enhanced_tests.jsonl",
      "spec_model": "glm_5_2",
      "spec_system_prompt": "You are an expert in software testing and C++ numerical code.\nYou design minimal, high-value edge-case test inputs.\nYou respond with STRICT JSON only: a single JSON array, no markdown\nfences, no prose. Every element must follow the schema given by the\nuser exactly.\n",
      "static_base_sizes": [
        0,
        1,
        2,
        7
      ],
      "llm_specs_min": 5,
      "llm_specs_max": 8,
      "target_cases_per_benchmark": 20,
      "max_spec_size": 4096,
      "offered_patterns": [
        "random",
        "all_zeros",
        "all_same",
        "ascending",
        "descending",
        "alternating",
        "extreme_values",
        "duplicate_at",
        "sorted_except_one",
        "spike_at",
        "explicit_values"
      ],
      "explicit_values_max_size": 64,
      "baseline_prompt_max_chars": 12000,
      "execution_models": [
        "serial",
        "omp",
        "mpi"
      ],
      "enhanced_launch": {
        "omp_threads": 4,
        "mpi_ranks": 4
      },
      "run_timeout_seconds": 60,
      "jobs": {
        "serial": 2,
        "omp": 1,
        "mpi": 1
      },
      "specs_file": "thesis/results/cache/enhanced/specs.jsonl"
    },
    "repair": {
      "enabled": true,
      "max_iterations": 2,
      "variants": [
        "static_feedback",
        "test_feedback",
        "combined_feedback"
      ],
      "api_mode": "direct",
      "api_mode_overrides": {},
      "external_tools_mode": "docker",
      "external_tools": [
        "parcoach",
        "llov"
      ],
      "host_repo_path": null,
      "external_tool_commands": {
        "parcoach": "docker run --rm -u 0 -v \"{host_repo}:/workspace\" -w /workspace registry.gitlab.inria.fr/parcoach/parcoach-demo:2.4.1 python3 thesis/evaluation/run_static_analysis.py --config {config} --profile {profile} --run-id {run_id} --model-id {model_id} --tools {tools}",
        "llov": "docker run --rm -u 0 -v \"{host_repo}:/workspace\" -w /workspace pareval-llov python3.8 thesis/evaluation/run_static_analysis.py --config {config} --profile {profile} --run-id {run_id} --model-id {model_id} --tools {tools}"
      },
      "history_mode": "full",
      "feedback": {
        "low_confidence_prefix": "Low-confidence hint (tool precision ~0.5 on validation suites) — verify at the given location before changing code:\n",
        "include_non_blocking": false,
        "history_message_max_chars": 80,
        "mismatch_report_max_indices": 3,
        "templates": {
          "task_header": "## Original task",
          "history_iteration_header": "## Iteration {n} (previous attempt)",
          "current_header": "## Current version (fix this)",
          "feedback_header": "## Analysis feedback on the current version",
          "non_blocking_header": "Non-blocking quality hints (optional improvements, not errors):\n",
          "instruction": "Output the complete corrected function. Line numbers in the feedback refer to the current version shown above.\n",
          "driver_error": "error at the call site in the test driver (your function name/signature likely does not match the expected interface): {message}\n"
        }
      },
      "strategies": {
        "static_feedback": {
          "sources": [
            "compiler_errors",
            "static_findings"
          ]
        },
        "test_feedback": {
          "sources": [
            "compiler_errors",
            "correctness_verdicts",
            "dynamic_findings"
          ]
        },
        "combined_feedback": {
          "sources": [
            "compiler_errors",
            "static_findings",
            "correctness_verdicts",
            "dynamic_findings"
          ]
        }
      },
      "low_confidence_stop_mode": "grace_once"
    }
  }
}
