    "full": {
      "run_id": "full_001",
      "prompt_limit": null,
      "num_samples_per_prompt": 1
    },
    "recovery": {
      "run_id": "full_ext_recovery_001",
      "num_samples_per_prompt": 1,
      "parent_run_id": "full_ext_001",
      "selection": "parent_reference"
    }
  },
  "prompts": {
    "path": "thesis/prompts/generation-prompts-thesis.json",
    "prompt_field": "prompt",
    "execution_models": [
      "serial",
      "omp",
      "mpi"
    ],
    "problem_types": null
  },
  "generation_defaults": {
    "max_output_tokens": 16384,
    "temperature": 0,
    "top_p": null,
    "timeout_seconds": 300,
    "retry_attempts": 2,
    "sleep_seconds_between_requests": 0,
    "api_mode": "batch",
    "api_mode_overrides": {},
    "system_prompt": "You are an expert C++ and parallel programming assistant.\nComplete the given function according to the prompt.\nReturn only the generated C++ code needed to complete the function.\nDo not include Markdown fences, explanations, or extra text.\nPreserve the required execution model: Serial, OpenMP, or MPI.\n"
  },
