<text x="20.00" y="446.00" font-size="10" text-anchor="start" fill="#52514e">Population: GENERATED (diagnostic only; never mixed with FINAL or STEP rates); unit: artifact x tool; block: composite.</text>
<text x="20.00" y="462.00" font-size="10" text-anchor="start" fill="#52514e">Composite block, GENERATED (diagnostic only; never mixed with FINAL or STEP rates); S01 (static) / D01 (dynamic) analysis</text>
<text x="20.00" y="475.00" font-size="10" text-anchor="start" fill="#52514e">state per tool; COMPLETED does not imply defect-free code; inapplicable states are not analysis gaps.</text>
<text x="20.00" y="491.00" font-size="10" text-anchor="start" fill="#52514e">EFFECTIVE_STATES: Tool states are the effective states (framework.effective_tool_state): a front-end TOOL_ERROR or PARTIAL</text>
<text x="20.00" y="504.00" font-size="10" text-anchor="start" fill="#52514e">entry of an artifact whose build failed counts as NOT_ANALYZED (dataset_disclosures.effective_state_overrides); the closure</text>
<text x="20.00" y="517.00" font-size="10" text-anchor="start" fill="#52514e">register reports the raw states.</text>
