<text x="190.00" y="414.00" font-size="11" text-anchor="start" fill="#52514e">−20.0</text>
<text x="298.00" y="414.00" font-size="11" text-anchor="middle" fill="#52514e">0</text>
<text x="406.00" y="414.00" font-size="11" text-anchor="end" fill="#52514e">+20.0</text>
<text x="422.00" y="396.00" font-size="12" text-anchor="start" fill="#52514e">R04 Q06 net gain (pp)</text>
<text x="20.00" y="438.00" font-size="10" text-anchor="start" fill="#52514e">Population: BASE paired with FINAL[v] (identical base-cell cohort per model); unit: base cell; block: composite.</text>
<text x="20.00" y="454.00" font-size="10" text-anchor="start" fill="#52514e">Composite block; cell = R04 net gain of Q06 correctness pass (FINAL[v] - BASE) in percentage points; blue = gain, red = loss,</text>
<text x="20.00" y="467.00" font-size="10" text-anchor="start" fill="#52514e">gray midpoint = 0 (colour scale beside the plot); bold value = its 95% CI excludes 0 (a degenerate zero-width interval is</text>
<text x="20.00" y="480.00" font-size="10" text-anchor="start" fill="#52514e">never bold; its value carries †); descriptive per model (unadjusted CIs, no test, no ranking).</text>
<text x="20.00" y="496.00" font-size="10" text-anchor="start" fill="#52514e">CIs (in the data CSV): 95% CI: nonparametric cluster bootstrap, percentile intervals, stratified by block (pilot benchmarks</text>
<text x="20.00" y="509.00" font-size="10" text-anchor="start" fill="#52514e">resampled among the 12 pilot benchmarks, full_ext among its 48); seed 20261017; cluster = benchmark; 2,000 replicates</text>
<text x="20.00" y="522.00" font-size="10" text-anchor="start" fill="#52514e">(descriptive, unadjusted).</text>
<text x="20.00" y="538.00" font-size="10" text-anchor="start" fill="#52514e">BL01: Includes dense_la/00 (BL-01 tolerance convention: possible false FAIL verdicts; disclosure-bearing aggregate);</text>
<text x="20.00" y="551.00" font-size="10" text-anchor="start" fill="#52514e">sensitivity SA1 in T10.</text>
<text x="20.00" y="567.00" font-size="10" text-anchor="start" fill="#52514e">REASONING: Reasoning settings differ between models and are not equalised (see the closure disclosure register, item</text>
<text x="20.00" y="580.00" font-size="10" text-anchor="start" fill="#52514e">reasoning_policy_differences); some providers report no reasoning-token field.</text>
<text x="20.00" y="596.00" font-size="10" text-anchor="start" fill="#52514e">IC1: Q06 is in-sample for test_feedback and combined_feedback: their loops see the ParEval test verdict and stop when it</text>
<text x="20.00" y="609.00" font-size="10" text-anchor="start" fill="#52514e">passes (every stopped_tests_pass trajectory is a Q06 pass), so they optimise the endpoint; for static_feedback Q06 is</text>
<text x="20.00" y="622.00" font-size="10" text-anchor="start" fill="#52514e">out-of-sample (measured once in phase 2, never seen by the loop). The variants therefore differ in trigger and stop rules,</text>
<text x="20.00" y="635.00" font-size="10" text-anchor="start" fill="#52514e">not only in feedback content; test_feedback cannot regress on Q06 by construction.</text>
<text x="20.00" y="651.00" font-size="10" text-anchor="start" fill="#52514e">IC2: E02 is not an independent confirmation of Q06 gains: it counts build failures, and most E02 improvements are the same</text>
<text x="20.00" y="664.00" font-size="10" text-anchor="start" fill="#52514e">cells as the Q06 improvements; the held-out signal proper is the joint transition X06 (e.g. Q06 repaired but E02 still</text>
<text x="20.00" y="677.00" font-size="10" text-anchor="start" fill="#52514e">failing) and G01.</text>
<text x="20.00" y="693.00" font-size="10" text-anchor="start" fill="#52514e">IC6: static_feedback repair triggers are dominated by clang-tidy bugprone findings and, on MPI, by low-confidence hints</text>
<text x="20.00" y="706.00" font-size="10" text-anchor="start" fill="#52514e">(design document: no trustworthy static MPI tool exists); static_feedback results measure this frozen blocking-set</text>
<text x="20.00" y="719.00" font-size="10" text-anchor="start" fill="#52514e">configuration, not static analysis in general.</text>
</svg>
