<text x="607.00" y="91.00" font-size="12" text-anchor="start" fill="#0b0b0b">test_feedback</text>
<polygon points="591.00,101.60 595.95,111.05 586.05,111.05" fill="#1baf7a" stroke="#ffffff" stroke-width="1"/>
<text x="607.00" y="111.00" font-size="12" text-anchor="start" fill="#0b0b0b">combined_feedback</text>
<text x="20.00" y="438.00" font-size="10" text-anchor="start" fill="#52514e">Population: FINAL[v] vs BASE (R04) and REPAIR_CANDIDATES (C02 output tokens, diagnostic only); unit: model x variant; block:</text>
<text x="20.00" y="451.00" font-size="10" text-anchor="start" fill="#52514e">composite.</text>
<text x="20.00" y="467.00" font-size="10" text-anchor="start" fill="#52514e">Composite block; one point per (model, variant): repair output tokens of the variant's repair candidates vs net gain of Q06</text>
<text x="20.00" y="480.00" font-size="10" text-anchor="start" fill="#52514e">correctness pass; descriptive only (no ranking, no test).</text>
<text x="20.00" y="496.00" font-size="10" text-anchor="start" fill="#52514e">Point labels (model): 1 = claude_fable_5; 2 = claude_opus_5; 3 = deepseek_v4_flash; 4 = deepseek_v4_pro; 5 = gemini_31_pro; 6</text>
<text x="20.00" y="509.00" font-size="10" text-anchor="start" fill="#52514e">= gemini_36_flash; 7 = openai_gpt55; 8 = openai_gpt56_sol; 9 = qwen36_35b_a3b; 10 = qwen37_max; 11 = qwen3_coder_api.</text>
<text x="20.00" y="525.00" font-size="10" text-anchor="start" fill="#52514e">BL01: Includes dense_la/00 (BL-01 tolerance convention: possible false FAIL verdicts; disclosure-bearing aggregate);</text>
<text x="20.00" y="538.00" font-size="10" text-anchor="start" fill="#52514e">sensitivity SA1 in T10.</text>
<text x="20.00" y="554.00" font-size="10" text-anchor="start" fill="#52514e">REASONING: Reasoning settings differ between models and are not equalised (see the closure disclosure register, item</text>
<text x="20.00" y="567.00" font-size="10" text-anchor="start" fill="#52514e">reasoning_policy_differences); some providers report no reasoning-token field.</text>
<text x="20.00" y="583.00" font-size="10" text-anchor="start" fill="#52514e">IC1: Q06 is in-sample for test_feedback and combined_feedback: their loops see the ParEval test verdict and stop when it</text>
<text x="20.00" y="596.00" font-size="10" text-anchor="start" fill="#52514e">passes (every stopped_tests_pass trajectory is a Q06 pass), so they optimise the endpoint; for static_feedback Q06 is</text>
<text x="20.00" y="609.00" font-size="10" text-anchor="start" fill="#52514e">out-of-sample (measured once in phase 2, never seen by the loop). The variants therefore differ in trigger and stop rules,</text>
<text x="20.00" y="622.00" font-size="10" text-anchor="start" fill="#52514e">not only in feedback content; test_feedback cannot regress on Q06 by construction.</text>
<text x="20.00" y="638.00" font-size="10" text-anchor="start" fill="#52514e">IC2: E02 is not an independent confirmation of Q06 gains: it counts build failures, and most E02 improvements are the same</text>
<text x="20.00" y="651.00" font-size="10" text-anchor="start" fill="#52514e">cells as the Q06 improvements; the held-out signal proper is the joint transition X06 (e.g. Q06 repaired but E02 still</text>
<text x="20.00" y="664.00" font-size="10" text-anchor="start" fill="#52514e">failing) and G01.</text>
<text x="20.00" y="680.00" font-size="10" text-anchor="start" fill="#52514e">IC6: static_feedback repair triggers are dominated by clang-tidy bugprone findings and, on MPI, by low-confidence hints</text>
<text x="20.00" y="693.00" font-size="10" text-anchor="start" fill="#52514e">(design document: no trustworthy static MPI tool exists); static_feedback results measure this frozen blocking-set</text>
<text x="20.00" y="706.00" font-size="10" text-anchor="start" fill="#52514e">configuration, not static analysis in general.</text>
</svg>
