<text x="20.00" y="440.00" font-size="10" text-anchor="start" fill="#52514e">Population: STEP[v][k], k = 0, 1, 2 (identical base-cell cohort); unit: base cell; block: composite.</text>
<text x="20.00" y="456.00" font-size="10" text-anchor="start" fill="#52514e">Composite block; Q06 correctness pass (solid) and E02 enhanced all-pass (dashed) on the identical base-cell cohort per step</text>
<text x="20.00" y="469.00" font-size="10" text-anchor="start" fill="#52514e">(G02 overfitting check); STEP[v][0] == BASE and STEP[v][2] == FINAL[v] (checked).</text>
<text x="20.00" y="485.00" font-size="10" text-anchor="start" fill="#52514e">y axis truncated: it starts at 80%, not at 0 (data-driven lower bound floor((min - 2) / 5) * 5 over the plotted values and CI</text>
<text x="20.00" y="498.00" font-size="10" text-anchor="start" fill="#52514e">bounds); the series are dodged horizontally by 0.04 steps so that the error bars do not overlap.</text>
<text x="20.00" y="514.00" font-size="10" text-anchor="start" fill="#52514e">error bars: 95% CI: nonparametric cluster bootstrap, percentile intervals, stratified by block (pilot benchmarks resampled</text>
<text x="20.00" y="527.00" font-size="10" text-anchor="start" fill="#52514e">among the 12 pilot benchmarks, full_ext among its 48); seed 20261017; cluster = benchmark; 2,000 replicates (descriptive,</text>
<text x="20.00" y="540.00" font-size="10" text-anchor="start" fill="#52514e">unadjusted).</text>
<text x="20.00" y="556.00" font-size="10" text-anchor="start" fill="#52514e">BL01: Includes dense_la/00 (BL-01 tolerance convention: possible false FAIL verdicts; disclosure-bearing aggregate);</text>
<text x="20.00" y="569.00" font-size="10" text-anchor="start" fill="#52514e">sensitivity SA1 in T10.</text>
<text x="20.00" y="585.00" font-size="10" text-anchor="start" fill="#52514e">IC1: Q06 is in-sample for test_feedback and combined_feedback: their loops see the ParEval test verdict and stop when it</text>
<text x="20.00" y="598.00" font-size="10" text-anchor="start" fill="#52514e">passes (every stopped_tests_pass trajectory is a Q06 pass), so they optimise the endpoint; for static_feedback Q06 is</text>
<text x="20.00" y="611.00" font-size="10" text-anchor="start" fill="#52514e">out-of-sample (measured once in phase 2, never seen by the loop). The variants therefore differ in trigger and stop rules,</text>
<text x="20.00" y="624.00" font-size="10" text-anchor="start" fill="#52514e">not only in feedback content; test_feedback cannot regress on Q06 by construction.</text>
<text x="20.00" y="640.00" font-size="10" text-anchor="start" fill="#52514e">IC2: E02 is not an independent confirmation of Q06 gains: it counts build failures, and most E02 improvements are the same</text>
<text x="20.00" y="653.00" font-size="10" text-anchor="start" fill="#52514e">cells as the Q06 improvements; the held-out signal proper is the joint transition X06 (e.g. Q06 repaired but E02 still</text>
<text x="20.00" y="666.00" font-size="10" text-anchor="start" fill="#52514e">failing) and G01.</text>
<text x="20.00" y="682.00" font-size="10" text-anchor="start" fill="#52514e">IC6: static_feedback repair triggers are dominated by clang-tidy bugprone findings and, on MPI, by low-confidence hints</text>
<text x="20.00" y="695.00" font-size="10" text-anchor="start" fill="#52514e">(design document: no trustworthy static MPI tool exists); static_feedback results measure this frozen blocking-set</text>
<text x="20.00" y="708.00" font-size="10" text-anchor="start" fill="#52514e">configuration, not static analysis in general.</text>
</svg>
