<text x="320.00" y="414.00" font-size="12" text-anchor="middle" fill="#52514e">Block</text>
<rect x="585.00" y="61.00" width="12.00" height="12.00" fill="#8a8984"/>
<text x="607.00" y="71.00" font-size="12" text-anchor="start" fill="#0b0b0b">BASE</text>
<rect x="585.00" y="81.00" width="12.00" height="12.00" fill="#2a78d6"/>
<text x="607.00" y="91.00" font-size="12" text-anchor="start" fill="#0b0b0b">FINAL[static_feedback]</text>
<rect x="585.00" y="101.00" width="12.00" height="12.00" fill="#eb6834"/>
<text x="607.00" y="111.00" font-size="12" text-anchor="start" fill="#0b0b0b">FINAL[test_feedback]</text>
<rect x="585.00" y="121.00" width="12.00" height="12.00" fill="#1baf7a"/>
<text x="607.00" y="131.00" font-size="12" text-anchor="start" fill="#0b0b0b">FINAL[combined_feedback]</text>
<text x="20.00" y="440.00" font-size="10" text-anchor="start" fill="#52514e">Population: BASE and FINAL[v] (identical base-cell cohort); unit: base cell; block: pilot, full_ext, composite.</text>
<text x="20.00" y="456.00" font-size="10" text-anchor="start" fill="#52514e">Q06 correctness pass on BASE vs FINAL[v] (identical base-cell cohort, checked) per block.</text>
<text x="20.00" y="472.00" font-size="10" text-anchor="start" fill="#52514e">error bars: 95% CI: nonparametric cluster bootstrap, percentile intervals, stratified by block (pilot benchmarks resampled</text>
<text x="20.00" y="485.00" font-size="10" text-anchor="start" fill="#52514e">among the 12 pilot benchmarks, full_ext among its 48); seed 20261017; cluster = benchmark; 2,000 replicates (descriptive,</text>
<text x="20.00" y="498.00" font-size="10" text-anchor="start" fill="#52514e">unadjusted).</text>
<text x="20.00" y="514.00" font-size="10" text-anchor="start" fill="#52514e">BL01: Includes dense_la/00 (BL-01 tolerance convention: possible false FAIL verdicts; disclosure-bearing aggregate);</text>
<text x="20.00" y="527.00" font-size="10" text-anchor="start" fill="#52514e">sensitivity SA1 in T10.</text>
<text x="20.00" y="543.00" font-size="10" text-anchor="start" fill="#52514e">IC1: Q06 is in-sample for test_feedback and combined_feedback: their loops see the ParEval test verdict and stop when it</text>
<text x="20.00" y="556.00" font-size="10" text-anchor="start" fill="#52514e">passes (every stopped_tests_pass trajectory is a Q06 pass), so they optimise the endpoint; for static_feedback Q06 is</text>
<text x="20.00" y="569.00" font-size="10" text-anchor="start" fill="#52514e">out-of-sample (measured once in phase 2, never seen by the loop). The variants therefore differ in trigger and stop rules,</text>
<text x="20.00" y="582.00" font-size="10" text-anchor="start" fill="#52514e">not only in feedback content; test_feedback cannot regress on Q06 by construction.</text>
<text x="20.00" y="598.00" font-size="10" text-anchor="start" fill="#52514e">IC6: static_feedback repair triggers are dominated by clang-tidy bugprone findings and, on MPI, by low-confidence hints</text>
<text x="20.00" y="611.00" font-size="10" text-anchor="start" fill="#52514e">(design document: no trustworthy static MPI tool exists); static_feedback results measure this frozen blocking-set</text>
<text x="20.00" y="624.00" font-size="10" text-anchor="start" fill="#52514e">configuration, not static analysis in general.</text>
<text x="20.00" y="640.00" font-size="10" text-anchor="start" fill="#52514e">[a] pilot: pilot_002 / Pilotexperiment (12 benchmarks x 3 execution models x 11 models, 1 sample per prompt); pilot block has</text>
<text x="20.00" y="653.00" font-size="10" text-anchor="start" fill="#52514e">12 clusters: percentile intervals are approximate; flagged in every pilot table.</text>
</svg>
